<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff9f2" />
    <title>幻灯游园 · 96 种风格，逛着选</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=cream-1" />
  </head>
  <body>
    <header class="topbar">
      <button class="brand" type="button" data-top aria-label="回到顶部">
        <span class="brand-bean" aria-hidden="true"></span>
        <strong>幻灯游园</strong>
      </button>
      <div class="topbar-actions">
        <button class="btn btn-ghost" type="button" data-open-duel>快速二选一</button>
        <button class="btn btn-berry" type="button" data-open-tray>
          我的收藏 <b id="trayCount">0</b>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <h1>96 种风格，<em>逛着选。</em></h1>
        <p>同一份古典舞内容的 96 种长相：点开看大图，心动就收藏，纠结就来一场二选一。</p>
        <div class="hero-cta">
          <button class="btn btn-berry btn-big" type="button" data-start>开始逛画廊</button>
          <button class="btn btn-ghost btn-big" type="button" data-lucky>随机开一张</button>
        </div>
        <p class="hero-meta"><b id="statStyles">96</b> 套造型 · <b id="statLit">0</b> 张已生成真图</p>
      </div>
      <div class="hero-fan" aria-hidden="true">
        <figure class="fan-card fan-a"><img id="fanA" alt="" width="480" height="270" /></figure>
        <figure class="fan-card fan-b"><img id="fanB" alt="" width="480" height="270" /></figure>
        <figure class="fan-card fan-c"><img id="fanC" alt="" width="480" height="270" /></figure>
      </div>
    </section>

    <nav class="hall-strip" id="hallStrip" aria-label="园区导航"></nav>

    <main class="halls" id="halls"></main>

    <footer class="footer">古典舞 PPT 提案 · 幻灯游园风格选型站</footer>

    <div class="overlay" id="detailOverlay" hidden>
      <div class="sheet detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailName">
        <button class="sheet-close" type="button" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
        <div class="detail-stage">
          <img id="detailImage" alt="" decoding="async" />
          <div class="detail-pages" id="detailPages"></div>
          <button class="stage-nav nav-prev" type="button" data-step="-1" aria-label="上一套风格">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="stage-nav nav-next" type="button" data-step="1" aria-label="下一套风格">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="detail-info">
          <p class="detail-hall" id="detailHall">园区</p>
          <h2 id="detailName">风格名称</h2>
          <p class="detail-mood" id="detailMood"></p>
          <div class="detail-tags" id="detailTags"></div>
          <p class="detail-progress" id="detailProgress"></p>
          <div class="detail-actions">
            <button class="btn btn-berry btn-big" type="button" id="detailFav">收藏这套</button>
            <button class="btn btn-ghost" type="button" data-detail-duel>拿它对决</button>
          </div>
          <p class="detail-hint">左右键切换风格 · Esc 关闭</p>
        </div>
      </div>
    </div>

    <div class="overlay" id="duelOverlay" hidden>
      <div class="sheet duel-sheet" role="dialog" aria-modal="true" aria-labelledby="duelTitle">
        <button class="sheet-close" type="button" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
        <div class="duel-head">
          <h2 id="duelTitle">二选一</h2>
          <p>别想太久，点第一眼更喜欢的那张。赢家自动进收藏。</p>
          <span class="duel-round" id="duelRound">第 1 / 5 轮</span>
        </div>
        <div class="duel-pair">
          <button class="duel-pick" id="duelA" type="button"></button>
          <span class="duel-or" aria-hidden="true">或</span>
          <button class="duel-pick" id="duelB" type="button"></button>
        </div>
      </div>
    </div>

    <div class="overlay overlay-right" id="trayOverlay" hidden>
      <aside class="tray" role="dialog" aria-modal="true" aria-labelledby="trayTitle">
        <header class="tray-head">
          <h2 id="trayTitle">我的收藏</h2>
          <button class="sheet-close" type="button" data-close aria-label="关闭">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="tray-body">
          <div class="tray-list" id="trayList"></div>
          <div class="tray-empty" id="trayEmpty">
            <span class="tray-empty-bean" aria-hidden="true"></span>
            <p>还没有收藏。<br />去画廊点亮第一颗心吧。</p>
          </div>
          <section class="mix-card" id="mixCard" hidden>
            <h3>混一下试试</h3>
            <p class="mix-names" id="mixNames"></p>
            <input id="mixRange" type="range" min="10" max="90" value="50" aria-label="混合比例" />
            <p class="mix-text" id="mixText"></p>
          </section>
        </div>
        <footer class="tray-foot" id="trayFoot" hidden>
          <button class="btn btn-ghost" type="button" id="clearTray">清空</button>
          <button class="btn btn-berry" type="button" id="copyHandoff">复制客户确认单</button>
        </footer>
      </aside>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./slides-data.js?v=cream-1" defer></script>
    <script src="./image-manifest.js?v=cream-1" defer></script>
    <script src="./app.js?v=cream-1" defer></script>
  </body>
</html>
